<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f6">
  <link rel="icon" type="image/svg+xml" href="/marketing-logo.svg">
  <title>Mobile Login | WMS365</title>
  <style>
    :root{--bg:#f7f8f6;--panel:#fff;--line:#d5dcd7;--text:#17231d;--muted:#647069;--brand:#176b4b;--brand-pressed:#10563c;--danger:#a93636;--success:#14724f}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Arial,sans-serif}
    body{display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top)) 18px max(24px,env(safe-area-inset-bottom))}
    main{width:min(420px,100%)}
    .brand{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:24px}
    .brand img{width:44px;height:44px;object-fit:contain}
    .brand-copy{display:grid;gap:2px}
    .brand strong{font-size:24px;line-height:1}
    .brand span{color:var(--muted);font-size:12px;font-weight:800;letter-spacing:0;text-transform:uppercase}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:26px 22px;box-shadow:0 8px 28px rgba(24,42,52,.08)}
    .context{display:inline-flex;align-items:center;min-height:28px;margin-bottom:14px;padding:4px 9px;border:1px solid #bcd7c9;border-radius:6px;background:#eff8f3;color:#14563e;font-size:12px;font-weight:800;text-transform:uppercase}
    h1{margin:0 0 8px;font-size:27px;line-height:1.15}
    .subtitle{margin:0 0 24px;color:var(--muted);font-size:15px;line-height:1.45}
    label{display:block;margin:0 0 8px;font-size:15px;font-weight:750}
    input{display:block;width:100%;height:58px;margin:0 0 19px;padding:0 16px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);font-size:18px}
    input:focus{outline:3px solid rgba(23,107,75,.15);border-color:var(--brand)}
    button{width:100%;min-height:62px;border:0;border-radius:6px;background:var(--brand);color:#fff;font-size:19px;font-weight:800;cursor:pointer;touch-action:manipulation}
    button:active:not(:disabled){background:var(--brand-pressed)}
    button:disabled{opacity:.65;cursor:progress}
    .message{min-height:23px;margin-top:14px;text-align:center;font-size:14px;font-weight:600}
    .error{color:var(--danger)}
    .success{color:var(--success)}
    .access-note{margin:18px 0 0;text-align:center;color:var(--muted);font-size:13px;line-height:1.4}
    @media (max-width:380px){body{padding-left:12px;padding-right:12px}.card{padding:22px 18px}.brand{margin-bottom:18px}}
  </style>
</head>
<body>
  <main>
    <div class="brand"><img src="/marketing-logo.svg" alt="WMS365"><div class="brand-copy"><strong>WMS365</strong><span>Warehouse</span></div></div>
    <form class="card" id="loginForm">
      <div class="context">Worker access</div>
      <h1>Warehouse Login</h1>
      <p class="subtitle">Sign in to start warehouse work.</p>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" enterkeyhint="next" required autofocus>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" enterkeyhint="go" required>
      <button id="submitButton" type="submit">Sign in</button>
      <div class="message" id="message" role="status" aria-live="polite"></div>
    </form>
    <p class="access-note">Authorized warehouse staff only</p>
  </main>
  <script src="/mobile-bridge.js"></script>
  <script>
    const form=document.getElementById('loginForm');
    const button=document.getElementById('submitButton');
    const message=document.getElementById('message');
    function safeNext(value){const text=String(value||'').trim();return text.startsWith('/')&&!text.startsWith('//')&&!text.startsWith('/mobile/login')?text:'/mobile/warehouse'}
    const next=safeNext(new URLSearchParams(location.search).get('next'));
    fetch('/api/app/me').then(r=>r.ok?r.json():null).then(data=>{if(data?.authenticated) location.replace(next)}).catch(()=>{});
    form.addEventListener('submit',async event=>{
      event.preventDefault();
      button.disabled=true;button.textContent='Signing in...';message.className='message';message.textContent='';
      try{
        const response=await fetch('/api/app/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:form.email.value.trim(),password:form.password.value})});
        const data=await response.json().catch(()=>({}));
        if(!response.ok) throw new Error(data.error||'Login failed. Check your email and password.');
        message.className='message success';message.textContent='Signed in. Opening warehouse actions...';
        location.replace(next);
      }catch(error){message.className='message error';message.textContent=error.message||'Login failed.';button.disabled=false;button.textContent='Sign in'}
    });
  </script>
</body>
</html>

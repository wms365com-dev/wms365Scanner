<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Receive | WMS365</title>
<link rel="icon" href="/marketing-logo.svg">
<style>
:root{--ink:#142b3a;--muted:#5d707c;--line:#c8d5dc;--blue:#2479a5;--green:#24734c;--red:#9a3030;--bg:#eef3f5;--paper:#fff}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{font-family:Arial,sans-serif;background:var(--bg);color:var(--ink);letter-spacing:0}.app{width:min(720px,100%);min-height:100dvh;margin:auto;background:var(--paper);padding:calc(12px + env(safe-area-inset-top)) 12px calc(18px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;gap:10px;padding:4px 0 14px;border-bottom:1px solid var(--line)}.top img{width:38px;height:38px}.top h1{margin:0;font-size:22px}.top button{margin-left:auto}.panel{display:grid;gap:12px;padding:14px 0}.company{padding:10px 12px;border:1px solid var(--line);border-radius:7px;background:#f7fafb;font-weight:800}.search{display:grid;grid-template-columns:1fr 88px;gap:8px}input,select,textarea,button{font:700 16px Arial,sans-serif}input,select,textarea{width:100%;min-height:52px;padding:11px 12px;border:2px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}button{min-height:48px;padding:10px 14px;border:0;border-radius:7px;background:var(--blue);color:#fff;cursor:pointer}button.secondary{background:#e8eef1;color:var(--ink);border:1px solid var(--line)}button.success{background:var(--green)}button:disabled{opacity:.5;cursor:not-allowed}.list{display:grid;gap:8px}.order{display:grid;gap:3px;width:100%;padding:12px;border:2px solid var(--line);background:#fff;color:var(--ink);text-align:left}.order strong{font-size:18px}.order span{font-size:13px;color:var(--muted)}.hidden{display:none!important}.meta{display:grid;gap:5px;padding:12px;border-left:4px solid var(--blue);background:#f3f8fa}.line{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:7px;background:#fbfcfd}.line h2{margin:0;font-size:18px}.line small{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grid .wide{grid-column:1/-1}label{display:grid;gap:5px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase}.total{font-size:14px;font-weight:800}.status{padding:11px;border-radius:7px;background:#f1f5f6;color:var(--muted);font-size:14px;font-weight:700}.status.good{background:#edf7f1;color:var(--green)}.status.bad{background:#fff0f0;color:var(--red)}.savebar{position:sticky;bottom:0;padding:10px 0 calc(4px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#fff 20%);display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:430px){.grid{grid-template-columns:1fr}.grid .wide{grid-column:auto}.search{grid-template-columns:1fr 76px}}
</style>
</head>
<body>
<main class="app">
  <header class="top"><img src="/marketing-logo.svg" alt=""><h1>Receive</h1><button class="secondary" id="home" type="button">Home</button></header>
  <section class="panel" id="searchPanel">
    <div class="company" id="companyLabel">Company</div>
    <div class="search"><input id="search" autocomplete="off" autocapitalize="characters" enterkeyhint="search" placeholder="Inbound or PO number"><button id="scan" type="button">Scan</button></div>
    <div class="list" id="list"></div>
    <div class="status" id="searchStatus" role="status">Loading inbounds...</div>
  </section>
  <section class="panel hidden" id="receivePanel">
    <div class="meta"><strong id="inboundCode"></strong><span id="inboundMeta"></span><span class="total" id="palletTotal"></span></div>
    <div id="lines" class="list"></div>
    <div class="status" id="saveStatus" role="status"></div>
    <div class="savebar"><button class="secondary" id="back" type="button">Back</button><button class="success" id="save" type="button">Receive</button></div>
  </section>
</main>
<script src="/mobile-bridge.js"></script>
<script>
const $=id=>document.getElementById(id);const esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const norm=s=>String(s||'').trim().toUpperCase();
const params=new URLSearchParams(location.search);const company=norm(params.get('accountName')||params.get('account')||window.WMS365Mobile?.getCompanyContext?.()||'');let inbounds=[];let selected=null;let saving=false;
async function json(url,options={}){const response=await fetch(url,{cache:'no-store',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const text=await response.text();let data={};try{data=text?JSON.parse(text):{}}catch{}if(response.status===401){location.href='/login?next='+encodeURIComponent(location.pathname+location.search);throw new Error('Sign in required.')}if(!response.ok)throw new Error(data.error||'WMS365 could not complete this action.');return data}
function actionKey(){return window.WMS365Mobile?.makeIdempotencyKey?.('mobile-receive')||`mobile-receive-${crypto.randomUUID?.()||Date.now()}`}
function renderList(){const q=norm($('search').value);const rows=inbounds.filter(item=>!q||norm([item.inboundCode,item.referenceNumber,item.carrierName].join(' ')).includes(q));$('list').innerHTML=rows.length?rows.slice(0,30).map(item=>`<button class="order" type="button" data-id="${esc(item.id)}"><strong>${esc(item.inboundCode)}</strong><span>${esc(item.referenceNumber||'No PO reference')} | ${esc(item.status)}</span><span>${esc((item.lines||[]).length)} SKU line${(item.lines||[]).length===1?'':'s'}</span></button>`).join(''):'';$('searchStatus').textContent=rows.length?`${rows.length} inbound${rows.length===1?'':'s'}`:'No matching open inbounds for this company.'}
function lineMarkup(line,index){return `<article class="line" data-line-index="${index}" data-line-id="${esc(line.id)}" data-sku="${esc(line.sku)}"><h2>${esc(line.sku)}</h2><small>${esc(line.description||'')} | Expected ${esc(line.quantity)}</small><div class="grid"><label>Received quantity<input data-field="quantity" type="number" min="1" step="1" inputmode="numeric" value="${esc(line.quantity)}"></label><label>Pallets for SKU<input data-field="pallets" type="number" min="1" step="1" inputmode="numeric" value="1"></label><label class="wide">Receiving location<input data-field="location" autocapitalize="characters" value="${esc(line.receivedLocation||selected.receivingStageLocationCode||'RECEIVING-STAGE')}"></label>${line.lotTracked?`<label>Lot / batch<input data-field="lot" autocapitalize="characters" value="${esc(line.lotNumber||'')}"></label>`:''}${line.expirationTracked?`<label>Expiry<input data-field="expiry" type="date" value="${esc(line.expirationDate||'')}"></label>`:''}</div></article>`}
function updatePalletTotal(){const count=[...document.querySelectorAll('[data-field="pallets"]')].reduce((sum,input)=>sum+(Number(input.value)||0),0);$('palletTotal').textContent=`${count} pallet${count===1?'':'s'} entered`}
function openInbound(id){selected=inbounds.find(item=>String(item.id)===String(id));if(!selected)return;$('searchPanel').classList.add('hidden');$('receivePanel').classList.remove('hidden');$('inboundCode').textContent=selected.inboundCode;$('inboundMeta').textContent=[selected.accountName,selected.referenceNumber,selected.fulfillmentLocationName||selected.fulfillmentLocationCode].filter(Boolean).join(' | ');$('lines').innerHTML=(selected.lines||[]).map(lineMarkup).join('');$('saveStatus').textContent='';document.querySelectorAll('[data-field="pallets"]').forEach(input=>input.addEventListener('input',updatePalletTotal));updatePalletTotal();scrollTo(0,0)}
function allocations(){const result=[];for(const card of document.querySelectorAll('[data-line-index]')){const line=selected.lines[Number(card.dataset.lineIndex)];const qty=Number(card.querySelector('[data-field="quantity"]').value);const pallets=Number(card.querySelector('[data-field="pallets"]').value);const location=card.querySelector('[data-field="location"]').value.trim();const lot=card.querySelector('[data-field="lot"]')?.value.trim()||'';const expiry=card.querySelector('[data-field="expiry"]')?.value||'';if(!Number.isInteger(qty)||qty<1)throw new Error(`Enter a received quantity for ${line.sku}.`);if(!Number.isInteger(pallets)||pallets<1||pallets>qty)throw new Error(`Pallet count for ${line.sku} must be between 1 and ${qty}.`);if(!location)throw new Error(`Enter a receiving location for ${line.sku}.`);if(line.lotTracked&&!lot)throw new Error(`Enter the lot or batch for ${line.sku}.`);if(line.expirationTracked&&!expiry)throw new Error(`Enter the expiry date for ${line.sku}.`);const base=Math.floor(qty/pallets),remainder=qty%pallets;for(let i=0;i<pallets;i++)result.push({id:line.id,sku:line.sku,receivedQuantity:base+(i<remainder?1:0),receivedLocation:location,lotNumber:lot,expirationDate:expiry,palletReference:`${selected.inboundCode}-${line.sku}-P${i+1}`})}return result}
async function receive(){if(saving)return;const status=$('saveStatus');try{const receivingLines=allocations();if(!confirm(`Receive ${selected.inboundCode} with ${receivingLines.length} pallet allocation${receivingLines.length===1?'':'s'}?`))return;saving=true;$('save').disabled=true;status.className='status';status.textContent='Saving receipt...';const key=actionKey();const payload={status:'RECEIVED',receivingLines,idempotencyKey:key,idempotency_key:key,source:'mobile_web',deviceId:window.WMS365Mobile?.getDeviceId?.()||''};const data=await json(`/api/admin/portal-inbounds/${selected.id}/status`,{method:'POST',body:JSON.stringify(payload)});status.className='status good';status.textContent=`${data.inbound?.inboundCode||selected.inboundCode} received. Inventory and receipt records are saved.`;inbounds=inbounds.filter(item=>String(item.id)!==String(selected.id));setTimeout(()=>{selected=null;$('receivePanel').classList.add('hidden');$('searchPanel').classList.remove('hidden');renderList();scrollTo(0,0)},1200)}catch(error){status.className='status bad';status.textContent=error.message}finally{saving=false;$('save').disabled=false}}
async function load(){if(!company){location.href='/warehouse-actions';return}$('companyLabel').textContent=company;window.WMS365Mobile?.setCompanyContext?.(company);try{await json('/api/app/me');const data=await json('/api/admin/portal-inbounds?accountName='+encodeURIComponent(company));inbounds=(data.inbounds||[]).filter(item=>['SUBMITTED','ARRIVED'].includes(norm(item.status)));renderList()}catch(error){$('searchStatus').className='status bad';$('searchStatus').textContent=error.message}}
$('search').addEventListener('input',renderList);$('search').addEventListener('keydown',event=>{if(event.key==='Enter'){event.preventDefault();const first=document.querySelector('.order');if(first)first.click()}});$('list').addEventListener('click',event=>{const button=event.target.closest('[data-id]');if(button)openInbound(button.dataset.id)});$('home').addEventListener('click',()=>location.href='/warehouse-actions');$('back').addEventListener('click',()=>{selected=null;$('receivePanel').classList.add('hidden');$('searchPanel').classList.remove('hidden')});$('save').addEventListener('click',receive);$('scan').addEventListener('click',()=>{$('search').focus();window.WMS365Mobile?.beep?.('scan')});load();
</script>
</body>
</html>

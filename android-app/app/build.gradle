plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def configuredBaseUrl = (project.findProperty("WMS365_BASE_URL") ?: "https://app.wms365.co").toString().replaceAll("/+\$", "")
if (configuredBaseUrl.contains("your-live-wms365-domain.com") || configuredBaseUrl.contains("example.com")) {
    throw new GradleException("Placeholder WMS365_BASE_URL values are forbidden.")
}
def configuredOrigin = new URI(configuredBaseUrl)
if (configuredOrigin.scheme != "https" || !configuredOrigin.host || configuredOrigin.rawUserInfo != null ||
        !(configuredOrigin.port in [-1, 443]) || !(configuredOrigin.rawPath in [null, "", "/"]) ||
        configuredOrigin.rawQuery != null || configuredOrigin.rawFragment != null) {
    throw new GradleException("WMS365_BASE_URL must be a trusted HTTPS origin without credentials, a path, or a custom port.")
}
def configuredStartPath = (project.findProperty("WMS365_START_PATH") ?: "/mobile?mode=mobile").toString()
if (!configuredStartPath.startsWith("/")) {
    configuredStartPath = "/" + configuredStartPath
}

android {
    namespace "com.wms365.app"
    compileSdk 36

    defaultConfig {
        minSdk 26
        targetSdk 36
        versionCode 47
        versionName "0.3.7-distinct-icons"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "WMS365_BASE_URL", "\"${configuredBaseUrl}\""
    }

    flavorDimensions "audience"
    productFlavors {
        warehouse {
            dimension "audience"
            applicationId "com.wms365.warehouse"
            buildConfigField "String", "WMS365_START_PATH", "\"${configuredStartPath}\""
            buildConfigField "String", "WMS365_APP_MODE", '"warehouse"'
            manifestPlaceholders = [appLabel: "WMS365 Warehouse"]
        }
        customerPortal {
            dimension "audience"
            applicationId "com.wms365.customerportal"
            versionNameSuffix "-customer"
            buildConfigField "String", "WMS365_START_PATH", '"/portal.html"'
            buildConfigField "String", "WMS365_APP_MODE", '"customer_portal"'
            manifestPlaceholders = [appLabel: "WMS365 Customer Portal"]
        }
    }

    buildFeatures {
        buildConfig true
    }

    testBuildType project.findProperty("WMS365_TEST_BUILD_TYPE") ?: "debug"
    buildTypes {
        cloudTest {
            initWith debug
            applicationIdSuffix ".testlab"
            versionNameSuffix "-isolated"
            matchingFallbacks = ["debug"]
            buildConfigField "String", "WMS365_BASE_URL", '"https://wms365-test.invalid"'
            buildConfigField "String", "WMS365_START_PATH", '"/mobile?mode=mobile"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test:runner:1.6.2"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    implementation "androidx.core:core:1.13.1"
    implementation "com.journeyapps:zxing-android-embedded:4.3.0"
    implementation "com.google.android.gms:play-services-mlkit-document-scanner:16.0.0"
    implementation "com.google.mlkit:text-recognition:16.0.1"
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "com.google.android.play:app-update-ktx:2.1.0"
}
